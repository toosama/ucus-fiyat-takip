name: Pegasus Fiyat Takibi

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright kur
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Uçuş fiyatını kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > check.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const BOT_TOKEN = process.env.TELEGRAM_BOT_TOKEN;
          const CHAT_ID = process.env.TELEGRAM_CHAT_ID;

          const FLIGHT_DATE = "2026-08-16";
          const STOP_DATE = "2026-08-12";

          async function telegram(message) {
            if (!BOT_TOKEN || !CHAT_ID) {
              console.log("Telegram Secret eksik.");
              return;
            }

            const response = await fetch(
              `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  chat_id: CHAT_ID,
                  text: message
                })
              }
            );

            const result = await response.json();

            if (!result.ok) {
              throw new Error(
                "Telegram hatası: " + JSON.stringify(result)
              );
            }
          }

          function normalize(text) {
            return text
              .replace(/\u00a0/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function extractPrice(text) {
            const patterns = [
              /₺\s?([\d.,]+)/gi,
              /TRY\s?([\d.,]+)/gi,
              /([\d.,]+)\s?TL/gi
            ];

            const values = [];

            for (const pattern of patterns) {
              for (const match of text.matchAll(pattern)) {
                let value = match[1]
                  .replace(/\./g, "")
                  .replace(",", ".");

                const number = parseFloat(value);

                if (
                  Number.isFinite(number) &&
                  number >= 100 &&
                  number <= 100000
                ) {
                  values.push(number);
                }
              }
            }

            if (values.length === 0) {
              return null;
            }

            return Math.min(...values);
          }

          (async () => {

            const now = new Date();

            const turkeyDate =
              new Intl.DateTimeFormat("en-CA", {
                timeZone: "Europe/Istanbul",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
              }).format(now);

            console.log("Türkiye tarihi:", turkeyDate);

            if (turkeyDate > STOP_DATE) {
              console.log("Takip süresi sona erdi.");
              return;
            }

            const browser = await chromium.launch({
              headless: true,
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox"
              ]
            });

            const context = await browser.newContext({
              locale: "tr-TR",
              timezoneId: "Europe/Istanbul",
              viewport: {
                width: 1440,
                height: 1000
              },
              userAgent:
                "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
            });

            const page = await context.newPage();

            try {

              const url =
                "https://www.trip.com/flights/airport-cov-saw/?date=2026-08-16&curr=TRY&locale=tr-TR";

              console.log("Trip.com açılıyor...");
              console.log(url);

              const response = await page.goto(url, {
                waitUntil: "domcontentloaded",
                timeout: 90000
              });

              console.log(
                "HTTP:",
                response ? response.status() : "bilinmiyor"
              );

              await page.waitForTimeout(12000);

              const rawText =
                await page.locator("body").innerText();

              const text = normalize(rawText);

              console.log(
                "Sayfa uzunluğu:",
                text.length
              );

              console.log(
                text.substring(0, 15000)
              );

              /*
               * HEDEF:
               *
               * 16 Ağustos 2026
               * COV -> SAW
               * Pegasus
               * 08:15 -> 09:50
               *
               * Önce uçuş numarasını arıyoruz.
               */

              const hasPegasus =
                /Pegasus/i.test(text);

              const hasRoute =
                /COV/i.test(text) &&
                /SAW/i.test(text);

              const hasDeparture =
                /08[:.]15/.test(text);

              const hasArrival =
                /09[:.]50/.test(text);

              const hasFlightNumber =
                /PC\s?2081/i.test(text);

              console.log(
                "Pegasus:",
                hasPegasus
              );

              console.log(
                "COV:",
                /COV/i.test(text)
              );

              console.log(
                "SAW:",
                /SAW/i.test(text)
              );

              console.log(
                "08:15:",
                hasDeparture
              );

              console.log(
                "09:50:",
                hasArrival
              );

              console.log(
                "PC2081:",
                hasFlightNumber
              );

              /*
               * Önce tam hedefi deniyoruz.
               */

              const targetFound =
                hasPegasus &&
                hasRoute &&
                hasDeparture &&
                hasArrival;

              if (!targetFound) {

                console.log(
                  "Hedef uçuş bu sayfa metninde doğrulanamadı."
                );

                await telegram(
                  "⚠️ Pegasus fiyat kontrolü\n\n" +
                  "16 Ağustos 2026\n" +
                  "Çukurova (COV) → Sabiha Gökçen (SAW)\n" +
                  "08:15 → 09:50\n\n" +
                  "Uçuş sayfası açıldı ancak hedef uçuş bilgileri sayfada doğrulanamadı.\n\n" +
                  "Kontrol devam edecek."
                );

                return;
              }

              /*
               * TL fiyatı ara.
               */

              const price = extractPrice(text);

              if (!price) {

                console.log(
                  "Uçuş bulundu ancak TL fiyatı alınamadı."
                );

                await telegram(
                  "⚠️ Pegasus fiyat kontrolü\n\n" +
                  "Hedef uçuş bulundu:\n" +
                  "16 Ağustos 2026\n" +
                  "COV → SAW\n" +
                  "08:15 → 09:50\n\n" +
                  "Ancak güncel TL fiyatı sayfadan alınamadı."
                );

                return;
              }

              console.log(
                "GÜNCEL FİYAT:",
                price,
                "TL"
              );

              const file =
                "last_price.txt";

              let oldPrice = null;

              if (fs.existsSync(file)) {

                const old =
                  fs.readFileSync(
                    file,
                    "utf8"
                  ).trim();

                const parsed =
                  parseFloat(old);

                if (Number.isFinite(parsed)) {
                  oldPrice = parsed;
                }
              }

              fs.writeFileSync(
                file,
                String(price)
              );

              /*
               * İlk fiyat.
               */

              if (oldPrice === null) {

                await telegram(
                  "✈️ PEGASUS FİYAT TAKİBİ BAŞLADI\n\n" +
                  "16 Ağustos 2026\n" +
                  "Çukurova (COV) → Sabiha Gökçen (SAW)\n" +
                  "08:15 → 09:50\n\n" +
                  `Güncel fiyat: ${price.toLocaleString("tr-TR")} TL`
                );

              }

              /*
               * Fiyat düştü veya arttı.
               */

              else if (price !== oldPrice) {

                const difference =
                  price - oldPrice;

                const direction =
                  difference < 0
                    ? "📉 FİYAT DÜŞTÜ"
                    : "📈 FİYAT ARTTI";

                await telegram(
                  "🔔 PEGASUS FİYAT DEĞİŞTİ\n\n" +
                  `${direction}\n\n` +
                  "16 Ağustos 2026\n" +
                  "Çukurova (COV) → Sabiha Gökçen (SAW)\n" +
                  "08:15 → 09:50\n\n" +
                  `Eski fiyat: ${oldPrice.toLocaleString("tr-TR")} TL\n` +
                  `Yeni fiyat: ${price.toLocaleString("tr-TR")} TL\n` +
                  `Değişim: ${difference > 0 ? "+" : ""}${difference.toLocaleString("tr-TR")} TL`
                );

              }

              else {

                console.log(
                  "Fiyat değişmedi:",
                  price,
                  "TL"
                );
              }

            } catch (error) {

              console.error(
                "Kontrol hatası:",
                error.message
              );

              await telegram(
                "⚠️ Pegasus fiyat kontrolünde hata:\n\n" +
                error.message
              );

            } finally {

              await browser.close();

            }

          })();
          EOF

          node check.js

      - name: Fiyatı kaydet
        if: always()
        run: |
          git config user.name "Pegasus Price Bot"
          git config user.email "actions@github.com"

          git add last_price.txt || true

          git commit \
            -m "Uçuş fiyatı güncellendi" \
            || true

          git push || true