name: Pegasus Fiyat Takibi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  inspect-pegasus:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright kur
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Pegasus formunu incele
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > inspect.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          async function telegram(message) {
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chat = process.env.TELEGRAM_CHAT_ID;

            if (!token || !chat) return;

            await fetch(
              `https://api.telegram.org/bot${token}/sendMessage`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  chat_id: chat,
                  text: message
                })
              }
            );
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-dev-shm-usage"
              ]
            });

            const context = await browser.newContext({
              locale: "tr-TR",
              timezoneId: "Europe/Istanbul",
              viewport: {
                width: 1440,
                height: 1200
              }
            });

            const page = await context.newPage();

            try {
              console.log("Pegasus açılıyor...");

              await page.goto(
                "https://www.flypgs.com/",
                {
                  waitUntil: "domcontentloaded",
                  timeout: 90000
                }
              );

              await page.waitForTimeout(10000);

              console.log("Sayfa URL:");
              console.log(page.url());

              console.log("\n========== FRAME'LER ==========");

              for (const frame of page.frames()) {
                console.log(
                  "FRAME:",
                  frame.url()
                );
              }

              console.log(
                "\n========== INPUTLAR =========="
              );

              const inputs =
                await page.locator("input").evaluateAll(
                  els =>
                    els.map((e, i) => ({
                      index: i,
                      type: e.type,
                      name: e.name,
                      id: e.id,
                      placeholder: e.placeholder,
                      aria: e.getAttribute(
                        "aria-label"
                      ),
                      role: e.getAttribute("role"),
                      value: e.value,
                      visible:
                        !!(
                          e.offsetWidth ||
                          e.offsetHeight ||
                          e.getClientRects().length
                        )
                    }))
                );

              console.log(
                JSON.stringify(
                  inputs,
                  null,
                  2
                )
              );

              console.log(
                "\n========== BUTONLAR =========="
              );

              const buttons =
                await page.locator("button").evaluateAll(
                  els =>
                    els.map((e, i) => ({
                      index: i,
                      text:
                        e.innerText?.trim(),
                      aria:
                        e.getAttribute(
                          "aria-label"
                        ),
                      type: e.type,
                      visible:
                        !!(
                          e.offsetWidth ||
                          e.offsetHeight ||
                          e.getClientRects().length
                        )
                    }))
                );

              console.log(
                JSON.stringify(
                  buttons,
                  null,
                  2
                )
              );

              console.log(
                "\n========== TEXTAREA / CONTENTEDITABLE =========="
              );

              const editable =
                await page.locator(
                  "textarea, [contenteditable='true']"
                ).evaluateAll(
                  els =>
                    els.map((e, i) => ({
                      index: i,
                      tag: e.tagName,
                      text:
                        e.innerText?.trim(),
                      placeholder:
                        e.getAttribute(
                          "placeholder"
                        ),
                      aria:
                        e.getAttribute(
                          "aria-label"
                        ),
                      role:
                        e.getAttribute("role"),
                      visible:
                        !!(
                          e.offsetWidth ||
                          e.offsetHeight ||
                          e.getClientRects().length
                        )
                    }))
                );

              console.log(
                JSON.stringify(
                  editable,
                  null,
                  2
                )
              );

              console.log(
                "\n========== SAYFA METNİ =========="
              );

              const text =
                await page.locator(
                  "body"
                ).innerText();

              console.log(
                text.substring(
                  0,
                  12000
                )
              );

              fs.writeFileSync(
                "pegasus-page.txt",
                text
              );

              fs.writeFileSync(
                "pegasus-inputs.json",
                JSON.stringify(
                  inputs,
                  null,
                  2
                )
              );

              fs.writeFileSync(
                "pegasus-buttons.json",
                JSON.stringify(
                  buttons,
                  null,
                  2
                )
              );

              await page.screenshot({
                path:
                  "pegasus-home.png",
                fullPage: true
              });

              await telegram(
                "🔎 Pegasus form teşhisi tamamlandı.\n\n" +
                "GitHub Actions logunda INPUT/BUTTON bilgileri oluşturuldu.\n\n" +
                "Bir sonraki adımda gerçek selector'lerle uçuş araması yapılacak."
              );

            } catch (error) {

              console.error(
                "TEŞHİS HATASI:",
                error
              );

              await telegram(
                "❌ Pegasus teşhisinde hata:\n\n" +
                error.message
              );

              process.exitCode = 1;

            } finally {
              await browser.close();
            }
          })();
          EOF

          node inspect.js

      - name: Pegasus teşhis dosyalarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pegasus-form-debug
          path: |
            pegasus-home.png
            pegasus-page.txt
            pegasus-inputs.json
            pegasus-buttons.json
          if-no-files-found: ignore