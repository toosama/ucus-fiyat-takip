name: Pegasus Sayfa Testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pegasus:
    runs-on: ubuntu-latest

    steps:
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright kur
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Pegasus doğru sayfayı test et
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-dev-shm-usage"
              ]
            });

            const context = await browser.newContext({
              locale: "tr-TR",
              timezoneId: "Europe/Istanbul",
              viewport: {
                width: 1440,
                height: 1200
              }
            });

            const page = await context.newPage();

            try {
              const url =
                "https://www.flypgs.com/sehirler/adana-istanbul-ucak-bileti";

              console.log("Pegasus sayfası açılıyor:");
              console.log(url);

              const response = await page.goto(url, {
                waitUntil: "domcontentloaded",
                timeout: 90000
              });

              console.log(
                "HTTP:",
                response ? response.status() : "YOK"
              );

              await page.waitForTimeout(10000);

              console.log("");
              console.log("========== SAYFA ==========");

              console.log("URL:", page.url());
              console.log("TITLE:", await page.title());

              console.log("");
              console.log("========== INPUTLAR ==========");

              const inputs =
                await page.locator("input").evaluateAll(
                  els =>
                    els.map((e, i) => ({
                      index: i,
                      type: e.type,
                      name: e.name,
                      id: e.id,
                      placeholder: e.placeholder,
                      aria:
                        e.getAttribute("aria-label"),
                      value: e.value,
                      visible:
                        !!(
                          e.offsetWidth ||
                          e.offsetHeight ||
                          e.getClientRects().length
                        )
                    }))
                );

              console.log(
                JSON.stringify(inputs, null, 2)
              );

              console.log("");
              console.log("========== BUTONLAR ==========");

              const buttons =
                await page.locator("button").evaluateAll(
                  els =>
                    els.map((e, i) => ({
                      index: i,
                      text:
                        (e.innerText || "")
                          .trim()
                          .substring(0, 200),
                      aria:
                        e.getAttribute("aria-label"),
                      type: e.type,
                      visible:
                        !!(
                          e.offsetWidth ||
                          e.offsetHeight ||
                          e.getClientRects().length
                        )
                    }))
                );

              console.log(
                JSON.stringify(buttons, null, 2)
              );

              console.log("");
              console.log("========== SAYFA METNİ ==========");

              const text =
                await page.locator("body").innerText();

              console.log(
                text.substring(0, 15000)
              );

              console.log("");
              console.log(
                "========== FRAME SAYISI =========="
              );

              console.log(
                page.frames().length
              );

              for (const frame of page.frames()) {
                console.log(
                  "FRAME:",
                  frame.url()
                );
              }

              await page.screenshot({
                path: "pegasus-test.png",
                fullPage: true
              });

            } catch (error) {

              console.error(
                "HATA:",
                error
              );

              process.exitCode = 1;

            } finally {

              await browser.close();

            }
          })();
          EOF

          node test.js

      - name: Test ekran görüntüsünü yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pegasus-test
          path: pegasus-test.png
          if-no-files-found: ignore