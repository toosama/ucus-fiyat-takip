name: Pegasus Fiyat Takibi

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright kur
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Uçuş fiyatını kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > check.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const BOT_TOKEN = process.env.TELEGRAM_BOT_TOKEN;
          const CHAT_ID = process.env.TELEGRAM_CHAT_ID;

          const FLIGHT_DATE = "2026-08-16";
          const STOP_DATE = "2026-08-16";

          const FROM = "COV";
          const TO = "SAW";

          const TARGET_DEPARTURE = "08:15";
          const TARGET_ARRIVAL = "09:50";

          const TARGET_FLIGHT = "PC2081";

          async function telegram(message) {
            if (!BOT_TOKEN || !CHAT_ID) {
              console.log("Telegram Secret eksik.");
              return;
            }

            const response = await fetch(
              `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  chat_id: CHAT_ID,
                  text: message
                })
              }
            );

            const result = await response.json();

            if (!result.ok) {
              throw new Error(
                "Telegram hatası: " + JSON.stringify(result)
              );
            }
          }

          function normalize(text) {
            return text
              .replace(/\u00a0/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function priceToNumber(text) {
            if (!text) return null;

            let value = text
              .replace(/[^\d.,]/g, "")
              .trim();

            if (!value) return null;

            if (value.includes(",") && value.includes(".")) {
              value = value.replace(/\./g, "").replace(",", ".");
            } else if (value.includes(",")) {
              value = value.replace(",", ".");
            }

            const number = parseFloat(value);

            if (
              Number.isFinite(number) &&
              number >= 100 &&
              number <= 100000
            ) {
              return number;
            }

            return null;
          }

          function extractPrices(text) {
            const prices = [];

            const patterns = [
              /₺\s?([\d.]+(?:,\d{1,2})?)/gi,
              /TRY\s?([\d.]+(?:,\d{1,2})?)/gi,
              /([\d.]+(?:,\d{1,2})?)\s?TL/gi
            ];

            for (const pattern of patterns) {
              for (const match of text.matchAll(pattern)) {
                const value = priceToNumber(match[1]);

                if (value !== null) {
                  prices.push(value);
                }
              }
            }

            return [...new Set(prices)];
          }

          function flightMatches(text) {
            const normalized = normalize(text);

            const checks = {
              pegasus:
                /Pegasus/i.test(normalized),

              flightNumber:
                /PC\s*2081/i.test(normalized),

              departure:
                /08\s*[:.]\s*15/.test(normalized),

              arrival:
                /09\s*[:.]\s*50/.test(normalized),

              origin:
                /COV|Çukurova|Adana/i.test(normalized),

              destination:
                /SAW|Sabiha\s*Gökçen/i.test(normalized)
            };

            console.log("Uçuş kontrolü:", checks);

            return checks.pegasus &&
                   checks.departure &&
                   checks.arrival &&
                   checks.origin &&
                   checks.destination;
          }

          async function findFlightCard(page) {
            const candidates = await page.locator(
              "div, li, article, section"
            ).all();

            console.log(
              "Aday element sayısı:",
              candidates.length
            );

            for (const element of candidates) {
              try {
                const text = normalize(
                  await element.innerText({
                    timeout: 1000
                  })
                );

                if (!text || text.length < 20 || text.length > 5000) {
                  continue;
                }

                if (
                  /08\s*[:.]\s*15/.test(text) &&
                  /09\s*[:.]\s*50/.test(text) &&
                  /Pegasus/i.test(text)
                ) {
                  console.log(
                    "Hedef uçuş kartı bulundu:"
                  );

                  console.log(text);

                  return {
                    text,
                    element
                  };
                }
              } catch {
                continue;
              }
            }

            return null;
          }

          (async () => {
            const now = new Date();

            const turkeyDate =
              new Intl.DateTimeFormat("en-CA", {
                timeZone: "Europe/Istanbul",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
              }).format(now);

            console.log(
              "Türkiye tarihi:",
              turkeyDate
            );

            if (turkeyDate > STOP_DATE) {
              console.log(
                "Takip süresi sona erdi."
              );
              return;
            }

            const browser = await chromium.launch({
              headless: true,
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-dev-shm-usage"
              ]
            });

            const context =
              await browser.newContext({
                locale: "tr-TR",
                timezoneId: "Europe/Istanbul",
                viewport: {
                  width: 1440,
                  height: 1200
                },
                userAgent:
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
              });

            const page =
              await context.newPage();

            try {
              const url =
                "https://www.trip.com/flights/airport-cov-saw/?date=2026-08-16&curr=TRY&locale=tr-TR";

              console.log(
                "Trip.com açılıyor..."
              );

              console.log(url);

              const response =
                await page.goto(url, {
                  waitUntil: "domcontentloaded",
                  timeout: 90000
                });

              console.log(
                "HTTP:",
                response
                  ? response.status()
                  : "bilinmiyor"
              );

              await page.waitForTimeout(15000);

              /*
               * Sayfanın yüklenmesini biraz daha bekliyoruz.
               */

              await page.evaluate(
                () => window.scrollTo(
                  0,
                  document.body.scrollHeight
                )
              );

              await page.waitForTimeout(5000);

              /*
               * Önce gerçek uçuş kartını bulmaya çalış.
               */

              const flight =
                await findFlightCard(page);

              if (!flight) {
                const rawText =
                  await page.locator(
                    "body"
                  ).innerText();

                const text =
                  normalize(rawText);

                console.log(
                  "Hedef uçuş bulunamadı."
                );

                console.log(
                  "Sayfa uzunluğu:",
                  text.length
                );

                console.log(
                  text.substring(
                    0,
                    20000
                  )
                );

                /*
                 * Debug amacıyla ekran görüntüsü
                 * GitHub Actions artifact olarak
                 * saklanabilir.
                 */

                await page.screenshot({
                  path:
                    "pegasus-debug.png",
                  fullPage: true
                });

                await telegram(
                  "⚠️ Pegasus fiyat kontrolü\n\n" +
                  "16 Ağustos 2026\n" +
                  "Çukurova (COV) → Sabiha Gökçen (SAW)\n" +
                  "08:15 → 09:50\n\n" +
                  "Hedef uçuş Trip.com sonuçlarında doğrulanamadı.\n\n" +
                  "Kontrol devam edecek."
                );

                return;
              }

              /*
               * Hedef uçuş bulundu.
               */

              console.log(
                "HEDEF UÇUŞ BULUNDU:"
              );

              console.log(
                flight.text
              );

              /*
               * Önce uçuş kartının içindeki fiyatları
               * almaya çalışıyoruz.
               */

              const prices =
                extractPrices(
                  flight.text
                );

              console.log(
                "Kart fiyatları:",
                prices
              );

              /*
               * Kartta fiyat yoksa tüm sayfada ara.
               */

              let price =
                prices.length
                  ? Math.min(...prices)
                  : null;

              if (!price) {
                const pageText =
                  normalize(
                    await page.locator(
                      "body"
                    ).innerText()
                  );

                const pagePrices =
                  extractPrices(
                    pageText
                  );

                console.log(
                  "Sayfa fiyatları:",
                  pagePrices
                );

                if (pagePrices.length) {
                  price =
                    Math.min(
                      ...pagePrices
                    );
                }
              }

              if (!price) {
                console.log(
                  "Uçuş bulundu fakat fiyat alınamadı."
                );

                await telegram(
                  "⚠️ Pegasus fiyat kontrolü\n\n" +
                  "Hedef uçuş bulundu:\n" +
                  "16 Ağustos 2026\n" +
                  "COV → SAW\n" +
                  "08:15 → 09:50\n\n" +
                  "Ancak fiyat bilgisi alınamadı."
                );

                return;
              }

              console.log(
                "GÜNCEL FİYAT:",
                price,
                "TL"
              );

              const file =
                "last_price.txt";

              let oldPrice = null;

              if (
                fs.existsSync(file)
              ) {
                const old =
                  fs.readFileSync(
                    file,
                    "utf8"
                  ).trim();

                const parsed =
                  parseFloat(old);

                if (
                  Number.isFinite(parsed)
                ) {
                  oldPrice = parsed;
                }
              }

              fs.writeFileSync(
                file,
                String(price)
              );

              /*
               * İlk fiyat.
               */

              if (
                oldPrice === null
              ) {
                await telegram(
                  "✈️ PEGASUS FİYAT TAKİBİ BAŞLADI\n\n" +
                  "16 Ağustos 2026\n" +
                  "Çukurova (COV) → Sabiha Gökçen (SAW)\n" +
                  "08:15 → 09:50\n\n" +
                  `Güncel fiyat: ${price.toLocaleString("tr-TR")} TL`
                );
              }

              /*
               * Fiyat değişti.
               */

              else if (
                price !== oldPrice
              ) {
                const difference =
                  price - oldPrice;

                const direction =
                  difference < 0
                    ? "📉 FİYAT DÜŞTÜ"
                    : "📈 FİYAT ARTTI";

                await telegram(
                  "🔔 PEGASUS FİYAT DEĞİŞTİ\n\n" +
                  `${direction}\n\n` +
                  "16 Ağustos 2026\n" +
                  "Çukurova (COV) → Sabiha Gökçen (SAW)\n" +
                  "08:15 → 09:50\n\n" +
                  `Eski fiyat: ${oldPrice.toLocaleString("tr-TR")} TL\n` +
                  `Yeni fiyat: ${price.toLocaleString("tr-TR")} TL\n` +
                  `Değişim: ${difference > 0 ? "+" : ""}${difference.toLocaleString("tr-TR")} TL`
                );
              }

              else {
                console.log(
                  "Fiyat değişmedi:",
                  price,
                  "TL"
                );
              }

            } catch (error) {

              console.error(
                "Kontrol hatası:",
                error
              );

              await telegram(
                "⚠️ Pegasus fiyat kontrolünde hata:\n\n" +
                error.message
              );

              process.exitCode = 1;

            } finally {

              await browser.close();
            }

          })();
          EOF

          node check.js

      - name: Debug ekran görüntüsünü yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trip-debug
          path: pegasus-debug.png
          if-no-files-found: ignore

      - name: Fiyatı kaydet
        if: always()
        run: |
          git config user.name "Pegasus Price Bot"
          git config user.email "actions@github.com"
          git add last_price.txt || true
          git commit -m "Uçuş fiyatı güncellendi" || true
          git push || true