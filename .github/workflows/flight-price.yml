name: Pegasus Fiyat Takibi

on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright kur
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Pegasus fiyatını kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |

          cat > check.js <<'EOF'

          const { chromium } = require("playwright");
          const fs = require("fs");

          const BOT_TOKEN = process.env.TELEGRAM_BOT_TOKEN;
          const CHAT_ID = process.env.TELEGRAM_CHAT_ID;

          async function telegram(message) {
            await fetch(
              `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  chat_id: CHAT_ID,
                  text: message
                })
              }
            );
          }

          (async () => {

            // 12 Ağustos 2026 sonrasında çalışmayı bırak
            const turkeyDate = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Europe/Istanbul",
              year: "numeric",
              month: "2-digit",
              day: "2-digit"
            }).format(new Date());

            console.log("Türkiye tarihi:", turkeyDate);

            if (turkeyDate > "2026-08-12") {
              console.log("Takip süresi sona erdi.");
              process.exit(0);
            }

            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              locale: "tr-TR",
              timezoneId: "Europe/Istanbul"
            });

            const page = await context.newPage();

            try {

              console.log("Pegasus açılıyor...");

              await page.goto("https://www.flypgs.com/", {
                waitUntil: "domcontentloaded",
                timeout: 90000
              });

              await page.waitForTimeout(7000);

              console.log("Sayfa açıldı.");

              // Görünür inputları bul
              const inputs = page.locator("input:visible");

              const inputCount = await inputs.count();

              console.log("Görünür input sayısı:", inputCount);

              if (inputCount < 3) {
                throw new Error(
                  "Pegasus arama formundaki inputlar bulunamadı."
                );
              }

              // İlk input = Nereden
              console.log("Nereden seçiliyor...");

              await inputs.nth(0).click();
              await inputs.nth(0).fill("Çukurova");

              await page.waitForTimeout(2500);

              // Çukurova Havalimanı seç
              const airportOptions = page.getByText(
                /Çukurova Havalimanı/i
              );

              if (await airportOptions.count() === 0) {
                throw new Error(
                  "Çukurova Havalimanı seçeneği bulunamadı."
                );
              }

              await airportOptions.last().click();

              await page.waitForTimeout(1000);

              // Yeniden görünür inputları al
              const inputs2 = page.locator("input:visible");

              console.log(
                "Nereye seçiliyor..."
              );

              await inputs2.nth(1).click();
              await inputs2.nth(1).fill("Sabiha Gökçen");

              await page.waitForTimeout(2500);

              const sabiha = page.getByText(
                /Sabiha Gökçen Havalimanı/i
              );

              if (await sabiha.count() === 0) {
                throw new Error(
                  "Sabiha Gökçen Havalimanı seçeneği bulunamadı."
                );
              }

              await sabiha.last().click();

              await page.waitForTimeout(1000);

              console.log("Tarih seçiliyor...");

              // Gidiş Tarihi alanını bul
              const departureText = page.getByText(
                "Gidiş Tarihi",
                { exact: true }
              );

              if (await departureText.count()) {
                await departureText.first().click();
              } else {
                // Formdaki üçüncü görünür input
                const inputs3 = page.locator("input:visible");
                await inputs3.nth(2).click();
              }

              await page.waitForTimeout(2000);

              // Ağustos 2026 görünür olana kadar bekle
              const augustText = page.getByText(
                /Ağustos\s*2026/i
              );

              if (await augustText.count()) {
                console.log("Ağustos 2026 takvimi bulundu.");
              }

              // 16 Ağustos
              const calendars = page.locator(
                '[role="dialog"]:visible'
              );

              let day16;

              if (await calendars.count()) {
                day16 = calendars.last().getByText(
                  "16",
                  { exact: true }
                );
              } else {
                day16 = page.getByText(
                  "16",
                  { exact: true }
                );
              }

              if (await day16.count() === 0) {
                throw new Error(
                  "16 Ağustos tarihi bulunamadı."
                );
              }

              await day16.last().click();

              await page.waitForTimeout(1000);

              // Yolcu menüsü
              const passengerText = page.getByText(
                "Yolcu Sayısını Seçin",
                { exact: true }
              );

              if (await passengerText.count()) {
                await passengerText.first().click();

                await page.waitForTimeout(500);

                const tamam = page.getByText(
                  "TAMAM",
                  { exact: true }
                );

                if (await tamam.count()) {
                  await tamam.first().click();
                }
              }

              await page.waitForTimeout(1000);

              console.log("Uçuş aranıyor...");

              const searchButton = page.getByText(
                "UCUZ UÇUŞ ARA",
                { exact: true }
              );

              if (await searchButton.count() === 0) {
                throw new Error(
                  "UCUZ UÇUŞ ARA butonu bulunamadı."
                );
              }

              await searchButton.first().click();

              console.log(
                "Sonuçların yüklenmesi bekleniyor..."
              );

              await page.waitForTimeout(15000);

              // Ekran görüntüsü
              await page.screenshot({
                path: "pegasus-result.png",
                fullPage: true
              });

              const bodyText =
                await page.locator("body").innerText();

              console.log(bodyText);

              const lines = bodyText
                .split("\n")
                .map(x => x.trim())
                .filter(Boolean);

              let price = null;

              // 08:15 uçuşunu bul
              for (let i = 0; i < lines.length; i++) {

                if (
                  lines[i].includes("08:15") ||
                  lines[i].includes("08.15")
                ) {

                  console.log(
                    "08:15 uçuşu bulundu."
                  );

                  const nearby = lines
                    .slice(i, i + 40)
                    .join(" ");

                  console.log(
                    "Uçuş bölümü:",
                    nearby
                  );

                  // TL fiyatı
                  const matches = nearby.match(
                    /(\d{1,3}(?:\.\d{3})*(?:,\d{2})?)\s*TL/g
                  );

                  if (matches && matches.length) {

                    const value =
                      matches[matches.length - 1]
                        .replace("TL", "")
                        .trim()
                        .replace(/\./g, "")
                        .replace(",", ".");

                    price = parseFloat(value);

                    break;
                  }
                }
              }

              if (!price) {

                throw new Error(
                  "08:15 uçuşunun TL fiyatı bulunamadı."
                );
              }

              console.log(
                "BULUNAN FİYAT:",
                price,
                "TL"
              );

              const priceFile =
                "last_price.txt";

              let oldPrice = null;

              if (fs.existsSync(priceFile)) {

                oldPrice = parseFloat(
                  fs.readFileSync(
                    priceFile,
                    "utf8"
                  )
                );
              }

              fs.writeFileSync(
                priceFile,
                String(price)
              );

              // İlk fiyat
              if (oldPrice === null) {

                await telegram(
                  `✈️ PEGASUS FİYAT TAKİBİ BAŞLADI\n\n` +
                  `Çukurova → Sabiha Gökçen\n` +
                  `16 Ağustos 2026\n` +
                  `08:15 → 09:50\n\n` +
                  `İlk fiyat: ${price.toLocaleString("tr-TR")} TL`
                );

              }

              // Fiyat değişti
              else if (price !== oldPrice) {

                const difference =
                  price - oldPrice;

                const percentage =
                  (difference / oldPrice) * 100;

                const direction =
                  difference < 0
                    ? "📉 FİYAT DÜŞTÜ"
                    : "📈 FİYAT ARTTI";

                await telegram(
                  `🔔 PEGASUS FİYAT DEĞİŞTİ\n\n` +
                  `${direction}\n\n` +
                  `Çukurova → Sabiha Gökçen\n` +
                  `16 Ağustos 2026\n` +
                  `08:15 → 09:50\n\n` +
                  `Eski: ${oldPrice.toLocaleString("tr-TR")} TL\n` +
                  `Yeni: ${price.toLocaleString("tr-TR")} TL\n` +
                  `Değişim: ${difference > 0 ? "+" : ""}${difference.toLocaleString("tr-TR")} TL\n` +
                  `Oran: ${percentage.toFixed(2)}%`
                );

              } else {

                console.log(
                  "Fiyat değişmedi:",
                  price
                );
              }

            } catch (error) {

              console.error(error);

              await telegram(
                `⚠️ PEGASUS FİYAT KONTROLÜNDE HATA\n\n` +
                `${error.message}`
              );

              process.exitCode = 1;

            } finally {

              await browser.close();

            }

          })();

          EOF

          node check.js

      - name: Fiyatı kaydet
        run: |
          git config user.name "Pegasus Price Bot"
          git config user.email "actions@github.com"
          git add last_price.txt
          git commit -m "Fiyat güncellendi" || true
          git push || true