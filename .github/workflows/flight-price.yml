name: Pegasus Fiyat Takibi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Telegram test mesajı gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "HATA: TELEGRAM_BOT_TOKEN Secret bulunamadı."
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "HATA: TELEGRAM_CHAT_ID Secret bulunamadı."
            exit 1
          fi

          MESSAGE="🟢 PEGASUS FİYAT TAKİBİ AKTİF

16 Ağustos 2026
Çukurova (COV) → Sabiha Gökçen (SAW)
08:15 → 09:50

GitHub Actions çalışıyor.
Telegram bağlantısı başarılı.

Fiyat kontrol sistemi hazır."

          RESPONSE=$(curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$(python3 -c 'import json,sys; print(json.dumps({"chat_id":sys.argv[1],"text":sys.argv[2]}))' "$TELEGRAM_CHAT_ID" "$MESSAGE")")

          echo "Telegram cevabı:"
          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"ok":true'

          echo "Telegram mesajı başarıyla gönderildi."